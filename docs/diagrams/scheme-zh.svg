<svg viewBox="0 0 1280 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scheme-zh-title scheme-zh-desc" id="scheme-zh-root">
        <title id="scheme-zh-title">MILP + 学到的日末电量价值</title>
        <desc id="scheme-zh-desc">方案结构：关闸前的前向折 XGB 预测给出状态特征；离线的起止 SoC 奖励缓存训练 Fitted Q Iteration，投影出的各档价值写进 24 h MILP；链式回测按实际价格结算，并以 ISEA 指数作为外部参照。</desc>
        <defs>
      <style>#scheme-zh-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; }
