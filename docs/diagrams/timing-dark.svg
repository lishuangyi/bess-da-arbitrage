<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="timing-dark-title timing-dark-desc" id="timing-dark-root">
        <title id="timing-dark-title">When the battery decides for delivery day D</title>
        <desc id="timing-dark-desc">Timeline of the day-ahead information rule: prices of D−1 are known from D−2 13:00, the whole day D is planned and locked at gate closure D−1 12:00, and the prices of D published at D−1 13:00 are used only to settle.</desc>
        <defs>
      <style>#timing-dark-root { --color-paper: #2d3142; --color-ink: #f5f5f5; --color-muted: #bfc0c0; }
      #timing-dark-root { font-family: 'Geist', system-ui, sans-serif; color: var(--color-ink); }
      #timing-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#timing-dark-root .diagram-container { overflow-x: visible; }
}</style><marker id="timing-dark-timing-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="timing-dark-timing-dark-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#949eb2"/></marker><marker id="timing-dark-timing-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker></defs>
        <rect width="100%" height="100%" fill="#2d3142"/>
        <line x1="80" y1="220" x2="1200" y2="220" stroke="#4f5d75" stroke-width="1" stroke-opacity="0.45"/><rect x="740" y="216" width="396" height="8" rx="2" fill="#f5f5f5" fill-opacity="0.14"/><path d="M80,192 V184 H532 V192" fill="none" stroke="#949eb2" stroke-width="1" stroke-dasharray="4,3"/><rect x="244.0" y="166" width="124" height="12" rx="2" fill="#2d3142"/><text x="306.0" y="175" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">INFORMATION SET FOR D</text><line x1="344" y1="212" x2="344" y2="228" stroke="#f5f5f5" stroke-width="1" stroke-opacity="0.3"/><text x="344" y="242" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">D-1 00:00</text><line x1="740" y1="212" x2="740" y2="228" stroke="#f5f5f5" stroke-width="1" stroke-opacity="0.3"/><text x="740" y="242" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">D 00:00</text><line x1="1136" y1="212" x2="1136" y2="228" stroke="#f5f5f5" stroke-width="1" stroke-opacity="0.3"/><text x="1136" y="242" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">D+1 00:00</text><line x1="80" y1="212" x2="80" y2="228" stroke="#f5f5f5" stroke-width="1" stroke-opacity="0.2"/><line x1="1200" y1="212" x2="1200" y2="228" stroke="#f5f5f5" stroke-width="1" stroke-opacity="0.2"/><line x1="164" y1="220" x2="164" y2="276" stroke="#f5f5f5" stroke-width="1" stroke-opacity="0.3"/><text x="164" y="292" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">D-2 13:00</text><text x="164" y="308" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Prices of D−1 published</text><text x="164" y="324" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">latest day in the set</text><circle cx="164" cy="220" r="4" fill="#f5f5f5"/><line x1="540" y1="148" x2="540" y2="220" stroke="#f08a59" stroke-width="1"/><text x="540" y="96" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">D-1 12:00</text><text x="540" y="116" fill="#f5f5f5" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Gate closure for D</text><text x="540" y="132" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">forecast, then lock the whole day</text><circle cx="540" cy="220" r="6" fill="#f08a59"/><line x1="556" y1="220" x2="556" y2="276" stroke="#f5f5f5" stroke-width="1" stroke-opacity="0.3"/><text x="556" y="292" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">D-1 13:00</text><text x="556" y="308" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Prices of D published</text><text x="556" y="324" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">used only to settle D</text><circle cx="556" cy="220" r="4" fill="#f5f5f5"/><line x1="740" y1="160" x2="740" y2="220" stroke="#f5f5f5" stroke-width="1" stroke-opacity="0.3"/><text x="740" y="108" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">D 00:00 TO 24:00</text><text x="740" y="128" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Delivery of D</text><text x="740" y="144" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">23, 24 or 25 hours</text><circle cx="740" cy="220" r="4" fill="#f5f5f5"/><line x1="40" y1="332" x2="1240" y2="332" stroke="#f5f5f5" stroke-width="0.8" stroke-opacity="0.1"/><text x="40" y="348" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text><circle cx="47" cy="365" r="4" fill="#f5f5f5"/><text x="62" y="368" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Event</text><circle cx="122.5" cy="365" r="6" fill="#f08a59"/><text x="137.5" y="368" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Decision point</text><rect x="236.89999999999998" y="361" width="16" height="8" rx="2" fill="#f5f5f5" fill-opacity="0.14"/><text x="258.9" y="368" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Delivery period</text><path d="M363.4,369 V362 H379.4 V369" fill="none" stroke="#949eb2" stroke-dasharray="4,3"/><text x="385.4" y="368" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Information set</text><text x="1240" y="368" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif" font-style="italic" text-anchor="end">Horizontal spacing is proportional to elapsed time (Europe/Berlin).</text>
      </svg>
