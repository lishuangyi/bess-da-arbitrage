e="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">D  (delivery day)</text><rect x="1087.1" y="284.0" width="64.90000000000009" height="32" fill="#131820" stroke="#2a313c" stroke-width="1.4"/><text x="1099.1" y="305" fill="#cbd5e1" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">D+1</text><path d="M48,250.0 V240.0 H490.6 V250.0" fill="none" stroke="#818cf8" stroke-width="2"/><rect x="56" y="214.0" width="294.6" height="20" fill="#0d1117"/><text x="60" y="229.0" fill="#818cf8" font-size="14" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">What the planner may use for D: prices of days ≤ D−1</text><line x1="502.6" y1="148" x2="502.6" y2="300" stroke="#60a5fa" stroke-width="2"/><line x1="129.2" y1="300" x2="129.2" y2="372.0" stroke="#818cf8" stroke-width="2"/><line x1="518.8" y1="300" x2="518.8" y2="372.0" stroke="#c4b5fd" stroke-width="2"/><line x1="892.2" y1="148" x2="892.2" y2="284.0" stroke="#34d399" stroke-width="2"/><path d="M638.8,414.0 H884.2 Q892.2,414.0 892.2,406.0 V316.0" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#timing-dark-timing-dark-arrow-c4b5fd)"/><rect x="675.5" y="388.0" width="180" height="16" rx="2" fill="#0d1117"/><text x="765.5" y="400.0" fill="#c4b5fd" font-size="11.5" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">USED ONLY TO SETTLE D</text><rect x="382.6" y="64" width="240" height="84" rx="6" fill="#161b22"/><rect x="382.6" y="64" width="240" height="84" rx="6" fill="#60a5fa" stroke="#60a5fa" stroke-width="2.4" fill-opacity="0.22"/><text x="502.6" y="88" fill="#60a5fa" font-size="13" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">D−1 12:00</text><text x="502.6" y="112" fill="#60a5fa" font-size="17" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" text-anchor="middle">Gate closure for D</text><text x="502.6" y="133" fill="#cbd5e1" font-size="13.5" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" text-anchor="middle">forecast, then lock the day</text><rect x="772.2" y="64" width="240" height="84" rx="6" fill="#161b22"/><rect x="772.2" y="64" width="240" height="84" rx="6" fill="#34d399" stroke="#34d399" stroke-width="1.6" fill-opacity="0.12"/><text x="892.2" y="88" fill="#34d399" font-size="13" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">D 00:00 – 24:00</text><text x="892.2" y="112" fill="#34d399" font-size="17" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" text-anchor="middle">Delivery of D</text><text x="892.2" y="133" fill="#cbd5e1" font-size="13.5" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" text-anchor="middle">23, 24 or 25 hours (DST)</text><rect x="16" y="372.0" width="240" height="84" rx="6" fill="#161b22"/><rect x="16" y="372.0" width="240" height="84" rx="6" fill="#818cf8" stroke="#818cf8" stroke-width="1.6" fill-opacity="0.12"/><text x="136.0" y="396.0" fill="#818cf8" font-size="13" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">D−2 13:00</text><text x="136.0" y="420.0" fill="#818cf8" font-size="17" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" text-anchor="middle">Prices of D−1 published</text><text x="136.0" y="441.0" fill="#cbd5e1" font-size="13.5" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" text-anchor="middle">latest day the planner sees</text><rect x="398.79999999999995" y="372.0" width="240" height="84" rx="6" fill="#161b22"/><rect x="398.79999999999995" y="372.0" width="240" height="84" rx="6" fill="#c4b5fd" stroke="#c4b5fd" stroke-width="1.6" fill-opacity="0.12"/><text x="518.8" y="396.0" fill="#c4b5fd" font-size="13" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">D−1 13:00</text><text x="518.8" y="420.0" fill="#c4b5fd" font-size="17" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" text-anchor="middle">Prices of D published</text><text x="518.8" y="441.0" fill="#cbd5e1" font-size="13.5" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" text-anchor="middle">after the plan is locked</text><circle cx="129.2" cy="300" r="9.5" fill="#0d1117"/><circle cx="129.2" cy="300" r="7" fill="#818cf8"/><circle cx="502.6" cy="300" r="9.5" fill="#0d1117"/><circle cx="502.6" cy="300" r="7" fill="#60a5fa"/><circle cx="518.8" cy="300" r="9.5" fill="#0d1117"/><circle cx="518.8" cy="300" r="7" fill="#c4b5fd"/><text x="1152" y="520" fill="#cbd5e1" font-size="13" font-style="italic" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" text-anchor="end">Horizontal spacing is proportional to elapsed time (Europe/Berlin).</text>
