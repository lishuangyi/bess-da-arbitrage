      #scheme-zh-dark-root { --color-paper: #2d3142; --color-ink: #f5f5f5; --color-muted: #bfc0c0; }
      #scheme-zh-dark-root { font-family: 'Geist', system-ui, sans-serif; color: var(--color-ink); }
      #scheme-zh-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#scheme-zh-dark-root .diagram-container { overflow-x: visible; }
