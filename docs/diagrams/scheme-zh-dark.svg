<svg viewBox="0 0 1280 692" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scheme-zh-dark-title scheme-zh-dark-desc" id="scheme-zh-dark-root">
        <title id="scheme-zh-dark-title">MILP + 拟合 Q 迭代学到的日末电量价值</title>
        <desc id="scheme-zh-dark-desc">从输入到输出的五个模块：已公布的 SMARD 价格进入 XGBoost 预测；离线奖励缓存训练拟合 Q 迭代，学到的日末电量价值写进 24 小时 MILP；当天计划按实际价格链式回测结算，并与 ISEA 指数比较。</desc>
