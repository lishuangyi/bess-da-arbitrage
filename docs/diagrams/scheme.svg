      <style>#scheme-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; }
      #scheme-root { font-family: 'Geist', system-ui, sans-serif; color: var(--color-ink); }
      #scheme-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#scheme-root .diagram-container { overflow-x: visible; }
