<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scheme-title scheme-desc" id="scheme-root">
        <title id="scheme-title">MILP with a learned end-of-day value</title>
        <desc id="scheme-desc">Architecture of the scheme: forward-fold XGB forecasts made before gate closure give state features; an offline reward cache of start/end SoC MILPs trains fitted Q iteration, whose projected value of each end level enters the 24 h MILP; a chained backtest settles at realised prices and is scored against the ISEA index.</desc>
