Y)</text><rect x="1180.6666666666667" y="450.0" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="1208.6666666666667" y="459.0" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REFERENCE</text><g data-node="SMARD prices"><rect x="40" y="320" width="208" height="72" rx="6" fill="#f5f5f5"/><rect x="40" y="320" width="208" height="72" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/><rect x="48" y="326" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.4"/><text x="62.0" y="335" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text><text x="144.0" y="362.0" fill="#2d3142" font-size="12.5" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" text-anchor="middle">SMARD prices</text><text x="144.0" y="378.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">60 min + 15 min</text></g><g data-node="Forward-fold XGB"><rect x="288" y="320" width="208" height="72" rx="6" fill="#f5f5f5"/><rect x="288" y="320" width="208" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="296" y="326" width="48" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.4"/><text x="320.0" y="335" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FORECAST</text><text x="392.0" y="362.0" fill="#2d3142" font-size="12.5" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" text-anchor="middle">Forward-fold XGB</text><text x="392.0" y="378.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">forecasts