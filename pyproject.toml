[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bess-da-arbitrage"
version = "0.2.0"
description = "Day-ahead BESS arbitrage in Germany (15-min): MILP with a terminal SoC value learned by fitted Q iteration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "scipy>=1.12",
    "pyyaml>=6",
    "requests>=2.31",
    "holidays>=0.50",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pytest>=8",
]

[project.scripts]
bess = "bess.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
